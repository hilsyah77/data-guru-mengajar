# Konfigurasi Nginx untuk Data Mengajar Guru di VPS
# Simpan berkas ini di: /etc/nginx/sites-available/dataguru
# Lalu aktifkan: ln -s /etc/nginx/sites-available/dataguru /etc/nginx/sites-enabled/
# Lalu tes & reload: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name namadomainanda.com www.namadomainanda.com; # Ganti dengan domain atau IP VPS Anda

    # Maksimal ukuran upload
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

